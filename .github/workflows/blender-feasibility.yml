name: blender-feasibility
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
          blender --version | head -n 1

      - name: Render test scene
        run: |
          mkdir -p /tmp/blender_frames
          START=$(date +%s)
          /usr/bin/time -v blender -b -P scenes/feasibility_test.py 2> /tmp/time.log || true
          END=$(date +%s)
          echo "RENDER_SECONDS=$((END-START))" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Maximum resident set size|Elapsed" /tmp/time.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FRAMES=$(ls /tmp/blender_frames | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Encode video
        run: |
          ffmpeg -y -framerate 24 -i /tmp/blender_frames/f_%04d.png \
            -c:v libx264 -pix_fmt yuv420p /tmp/feasibility_test.mp4
          ls -la /tmp/feasibility_test.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: feasibility_test
          path: /tmp/feasibility_test.mp4
