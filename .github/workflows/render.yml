name: Render Video

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded JSON payload'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run render
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          GDRIVE_SA_KEY_B64: ${{ secrets.GDRIVE_SA_KEY }}
        run: node render.js

      - name: Commit result JSON
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add results/ || true
          git commit -m "Render result ${{ github.run_id }}" || echo "nothing to commit"
          git push || echo "push failed, retrying with pull"
