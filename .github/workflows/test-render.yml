name: Test Documentary Renderer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check JavaScript syntax
        run: node --check render-test.js

      - name: Generate a test video
        run: |
          mkdir -p test-output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi \
            -i "color=c=black:s=1280x720:r=25:d=10" \
            -f lavfi \
            -i "sine=frequency=440:duration=10" \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            test-output/test-video.mp4

      - name: Verify generated video
        run: |
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            test-output/test-video.mp4

          test -s test-output/test-video.mp4
          echo "Test video generated successfully."

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: documentary-test-video
          path: test-output/test-video.mp4
          retention-days: 1
