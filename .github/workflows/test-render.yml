name: Test Documentary Renderer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create a space scene
        run: |
          mkdir -p test-output

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi \
            -i "color=c=0x05091f:s=1280x720:r=25:d=8" \
            -vf "drawbox=x=850:y=130:w=180:h=180:color=0x2864ff@0.9:t=fill,drawbox=x=870:y=150:w=140:h=140:color=0x68b5ff@0.9:t=fill,drawtext=text='SPACE TEST':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=550" \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            test-output/space-scene.mp4

      - name: Verify video
        run: |
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            test-output/space-scene.mp4

          test -s test-output/space-scene.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: space-scene-test
          path: test-output/space-scene.mp4
          retention-days: 1
